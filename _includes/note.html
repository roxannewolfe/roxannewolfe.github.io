<span class="annotation annotation--{{ include.type | default: 'note' }}">
  <span class="annotation-trigger" role="button" tabindex="0" aria-expanded="false">
    <mark class="annotation-highlight">{{ include.text }}</mark>
  </span>
  <span class="annotation-bubble" role="note" hidden>{{ include.note | markdownify | remove: '<p>' | remove: '</p>' }}</span>
</span>
