{% assign rendered_note = include.note | markdownify | remove: '<p>' | remove: '</p>' %}
<button class="reader-note-trigger reader-note-trigger--{{ include.type | default: 'note' }}" type="button" aria-expanded="false">{{ include.text }}</button><span class="reader-note-body reader-note-body--{{ include.type | default: 'note' }}" hidden>{{ rendered_note }}</span>
