{% assign asset_version = site.time | date: '%s' %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ '/assets/css/branding.css' | relative_url }}?v={{ asset_version }}">
  {% if page.extra_css %}
    <link rel="stylesheet" href="{{ page.extra_css | relative_url }}?v={{ asset_version }}">
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="site-branding">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="css-status" aria-hidden="true"></span>
    </div>
    {% include navigation.html %}
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Roxanne Maclaurin Wolfe (she/her)</p>
  </footer>

  <script src="{{ '/assets/js/annotations.js' | relative_url }}?v={{ asset_version }}" defer></script>
</body>
</html>
