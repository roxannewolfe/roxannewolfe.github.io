intro: >
  Hi!!! This is my blog, Genuine Pretending, where I write up stuff about my life and stuff I'm working on/have written recently! The namesake of this blog is a specific philosophical body I've been working on for a while, but I haven't fully worked it into theory yet. As for the blog, It's a bit empty at the moment but will certainly fill up. Anyway, have a look round, and stay a while!
